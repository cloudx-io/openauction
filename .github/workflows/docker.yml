name: Docker Build
on:
  workflow_run:
    workflows: ["Go"]
    types: [completed]
  workflow_dispatch:
    inputs:
      architecture:
        description: CPU architecture to build.
        type: choice
        default: arm64
        options:
          - arm64
          - amd64

jobs:
  enclave:
    # Only run if the Go workflow succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      id-token: write # for AWS OIDC authentication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7
        with:
          go-version: "1.26.5"
      - name: docker set architecture env vars
        env:
          ARCHITECTURE: ${{ github.event.inputs.architecture || 'arm64' }}
        run: |
          # arm64 is the default: automated workflow_run builds (no input) produce
          # the arm64 image. amd64 is opt-in via workflow_dispatch.
          case "${ARCHITECTURE}" in
            arm64|amd64) ;;
            *)
              echo "::error::Invalid architecture (must be arm64 or amd64)"
              exit 1
              ;;
          esac
          echo "ARCHITECTURE=${ARCHITECTURE}" >> "$GITHUB_ENV"
          if [ "${ARCHITECTURE}" = "arm64" ]; then
            echo "IMAGE_TAG_SUFFIX=-arm64" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG_SUFFIX=" >> "$GITHUB_ENV"
          fi
      - name: docker set publish env vars
        env:
          # Trigger metadata is bound into the environment rather than interpolated
          # into the script body; head_branch is a free-form ref name.
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REF: ${{ github.ref }}
        run: |
          # Automated builds publish, and move `latest`, only for a push to this
          # repository's default branch. A push run is always on the repository's
          # own ref, so event plus branch identify it without a repository check.
          # A dispatch on main publishes the same way; a non-main arm64 dispatch
          # publishes only the commit-specific tags used for EIF validation.
          PUBLISH_IMAGE=false
          TAG_LATEST=false
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            if [ "${TRIGGER_EVENT}" = "push" ] && [ "${TRIGGER_BRANCH}" = "main" ]; then
              PUBLISH_IMAGE=true
              TAG_LATEST=true
            fi
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${REF}" = "refs/heads/main" ]; then
              PUBLISH_IMAGE=true
              TAG_LATEST=true
            elif [ "${ARCHITECTURE}" = "arm64" ]; then
              PUBLISH_IMAGE=true
            fi
          fi
          echo "PUBLISH_IMAGE=${PUBLISH_IMAGE}" >> "$GITHUB_ENV"
          echo "TAG_LATEST=${TAG_LATEST}" >> "$GITHUB_ENV"
      - name: Configure AWS credentials
        if: env.PUBLISH_IMAGE == 'true'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # ratchet:aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr-push
          aws-region: us-east-1
      - name: Login to Amazon ECR
        if: env.PUBLISH_IMAGE == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # ratchet:aws-actions/amazon-ecr-login@v2
      - name: go build enclave binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH="${ARCHITECTURE}" go build -a -ldflags '-extldflags "-static"' -tags netgo -o ./bin/tee-auction-enclave ./enclave
      - name: docker set build tag env vars
        run: |
          VERSION="0.0.0"
          SHA="$(git rev-parse --short HEAD || echo 'unknown')"
          DIRTY="$(git diff --no-ext-diff --quiet --exit-code HEAD || echo '.dirty')"
          COMMIT="${SHA}${DIRTY}"
          echo "CLOUDX_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "CLOUDX_COMMIT=${COMMIT}" >> "$GITHUB_ENV"
          # Image tags and the revision label name the commit that was checked
          # out and built. github.sha is not used: for a workflow_run it is the
          # default-branch tip, which need not be the commit under build.
          COMMIT_SHA="$(git rev-parse HEAD)"
          echo "COMMIT_SHA=${COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "COMMIT_SHA_SHORT=${COMMIT_SHA:0:7}" >> "$GITHUB_ENV"
      - name: docker set metadata
        id: dockermetadata
        # https://github.com/docker/metadata-action
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # ratchet:docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/cloudx-io/openauction/enclave
          labels: |
            org.opencontainers.image.title=cloudx-io/openauction/enclave
            org.opencontainers.image.description=CloudX Nitro Enclave for secure auction processing
            org.opencontainers.image.vendor=cloudx.io
            org.opencontainers.image.source=https://github.com/cloudx-io/openauction
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
          tags: |
            # short sha of the commit
            type=raw,value=${{ env.COMMIT_SHA_SHORT }}${{ env.IMAGE_TAG_SUFFIX }},priority=100
            # long sha of the commit
            type=raw,value=${{ env.COMMIT_SHA }}${{ env.IMAGE_TAG_SUFFIX }},priority=100
            # our version tag, like "0.0.0-commit.ABCDEF01"
            type=raw,value=${{ env.CLOUDX_VERSION }}-commit.${{ env.CLOUDX_COMMIT }}${{ env.IMAGE_TAG_SUFFIX }}
            # "latest"
            type=raw,value=latest${{ env.IMAGE_TAG_SUFFIX }},enable=${{ env.TAG_LATEST == 'true' }}
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # ratchet:docker/setup-qemu-action@v4
        if: env.ARCHITECTURE == 'arm64'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # ratchet:docker/setup-buildx-action@v4
        with:
          platforms: linux/${{ env.ARCHITECTURE }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # ratchet:docker/build-push-action@v7
        with:
          context: .
          file: enclave/Dockerfile
          platforms: linux/${{ env.ARCHITECTURE }}
          # Non-main arm64 dispatches publish only commit/version-specific tags for EIF validation.
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          sbom: true
          provenance: mode=max
          tags: ${{ steps.dockermetadata.outputs.tags }}
          labels: ${{ steps.dockermetadata.outputs.labels }}
          build-args: |
            ENCLAVE_MAX_WORKERS=50
