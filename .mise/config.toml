monorepo_root = true
# minimum_release_age below needs mise 2026.4.22+; older mise ignores it
min_version = { soft = "2026.4.22" }

[monorepo]
config_roots = ["."]

[settings]
experimental = true
locked = true
minimum_release_age = "7d"

[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
"go:github.com/sethvargo/ratchet" = "0.12.0"
