name: Ratchet

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Ratchet Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # ratchet:jdx/mise-action@v5
        with:
          version: "2026.9.12"
      - name: Lint GitHub Actions refs
        run: mise run //:ratchet:lint
      - name: Verify pinning leaves no diff
        run: |
          mise run //:ratchet:pin
          git diff --exit-code
