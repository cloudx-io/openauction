name: Ratchet

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Ratchet Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # ratchet:jdx/mise-action@v4
      - name: Lint GitHub Actions refs
        run: mise run //:ratchet:lint
      - name: Verify pinning leaves no diff
        run: |
          mise run //:ratchet:pin
          git diff --exit-code
